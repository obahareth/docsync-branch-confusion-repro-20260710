name: Branch Ref Reproduction

on:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: Branch name selected by the modeled PR metadata
        required: true
        default: production
        type: string

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch name
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }}
          fetch-depth: 0

      - name: Commit fixed documentation marker
        run: |
          printf '\nWorkflow branch-ref reproduction marker.\n' >> README.md
          git config user.name 'docsync-repro[bot]'
          git config user.email 'docsync-repro[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: branch-ref reproduction marker'
          git push origin HEAD
